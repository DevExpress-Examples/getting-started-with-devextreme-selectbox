<dx-select-box
  [dataSource]="dataSource"
  valueExpr="ID"
  displayExpr="Name"
  [searchEnabled]="true"
  (onValueChanged)="onValueChanged($event)"
  label="Product"
  labelMode="floating"
  [grouped]="true"
>
  <dxo-select-box-drop-down-options
    [height]="150"
  ></dxo-select-box-drop-down-options>
</dx-select-box>
